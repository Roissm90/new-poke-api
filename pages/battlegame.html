<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Título</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="../styles/styles.css" />
    <link rel="stylesheet" href="../styles/atlas.css" />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <!-- AOS CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css"
    />
    <!-- AOS JS -->
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- jQuery UI JS -->
    <script src="https://code.jquery.com/ui/1.13.3/jquery-ui.min.js"></script>
    <!-- jQuery UI CSS (opcional, para estilos de widgets) -->
    <link
      rel="stylesheet"
      href="https://code.jquery.com/ui/1.13.3/themes/base/jquery-ui.css"
    />
    <!-- sonidos midi -->
    <script src="https://cdn.jsdelivr.net/npm/tone@latest/build/Tone.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.27/build/Midi.min.js"></script>
  </head>

  <body>
    <header>
      <nav class="nav">
        <div class="container-grid">
          <div class="wrapper-image-header">
            <a href="../index.html">
              <img
                src="../assets/logo_pokemon.png"
                alt="Logo Pokemon"
                class="image-header"
              />
            </a>
          </div>
          <div class="nav-logo">
            <button class="menu-toggle" aria-label="Abrir menú">
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
            </button>
          </div>
          <ul class="nav-list">
            <li data-page="home"><a href="../index.html">Home</a></li>
            <li data-page="pokedex"><a href="./pokedex.html">Pokédex</a></li>
            <!--<li data-page="pokemon"><a href="./pokemon.html">Pokémon</a></li>-->
            <li data-page="abilities">
              <a href="./abilities.html">Abilities</a>
            </li>
            <li data-page="moves"><a href="./moves.html">Moves</a></li>
            <li data-page="game"><a href="./game.html">Battle</a></li>
            <li data-page="activities"><a href="./activities.html">Activities</a></li>
          </ul>
        </div>
      </nav>
    </header>

    <section class="first-margin sctn-battle-game" data-aos="fade-up">
      <div class="container-grid">
        <div class="cpu-row row">
            <div class="info-cpu">
                <p class="level-cpu"></p>
                <div class="ps-cpu">
                    <div class="ps-bar-cpu">
                        <p class="ps-bar-text-cpu">PS:</p>
                        <div class="ps-bar-visual-cpu">
                            <span class="bg-color-dark-third"></span>
                        </div>
                    </div>
                    <div class="ps-number-cpu">
                        <p class="ps-number-text-cpu">
                            <span class="ps-text-actual-cpu"></span>
                             / 
                            <span class="ps-text-total-cpu"></span>
                        </p>
                    </div>
                </div>
            </div>
            <div class="wrapper-sprite-cpu">
                <img src="" class="sprite-cpu bg-color-light" alt=""/>
            </div>
            
            <p class="info-attack-cpu bg-color-dark-third text-color-light"></p>
        </div>
        <div class="player-row row">
            <div class="wrapper-sprite-player">
                <img src="" class="sprite-player bg-color-light" alt=""/>
            </div>
            <div class="info-player">
                <p class="level-player"></p>
                <div class="ps-player">
                    <div class="ps-bar-player">
                        <p class="ps-bar-text-player">PS:</p>
                        <div class="ps-bar-visual-player">
                            <span class="bg-color-dark-third"></span>
                        </div>
                    </div>
                    <div class="ps-number-player">
                        <p class="ps-number-text-player">
                            <span class="ps-text-actual-player"></span>
                             / 
                            <span class="ps-text-total-player"></span>
                        </p>
                    </div>
                </div>
            </div>
        </div>
        <p id="battleStatus" class="battle-status" role="status" aria-live="polite">Preparando combate…</p>
        <div class="moves-player-row row">
          <button type="button" class="move move-1 btn btn-dark" disabled>
            <span class="name"></span>
            <span class="pp">
                    <span class="actual"></span>/<span class="total"></span>
            </span>
          </button>
          <button type="button" class="move move-2 btn btn-dark" disabled>
            <span class="name"></span>
            <span class="pp">
                    <span class="actual"></span>/<span class="total"></span>
            </span>
          </button>
          <button type="button" class="move move-3 btn btn-dark" disabled>
            <span class="name"></span>
            <span class="pp">
                    <span class="actual"></span>/<span class="total"></span>
            </span>
          </button>
          <button type="button" class="move move-4 btn btn-dark" disabled>
            <span class="name"></span>
            <span class="pp">
                    <span class="actual"></span>/<span class="total"></span>
            </span>
          </button>
        </div>
        <a class="battle-exit btn btn-light" href="./game.html">Salir del combate</a>
      </div>
    </section>

    <div class="modal-battle modal">
      <div class="overlay">
        <button class="close-modal"></button>
        <h4 class="title text-color-dark-third"></h4>
        <img src="" alt="" class="picture" />
        <a href="./game.html" class="btn btn-dark">Volver</a>
      </div>
    </div>

    <script type="module" src="../scripts/index.js"></script>
    <script type="module" src="../scripts/battlegame.js"></script>
  </body>
</html>
