<!DOCTYPE html>

  <head>

  <body>
    <header>
    <nav class="nav">
      <div class="container-grid">
        <div class="wrapper-image-header">
          <a href="../index.html">
            <img
              src="../assets/logo_pokemon.png"
              alt="Logo Pokemon"
              class="image-header"
            />
          </a>
        </div>
        <div class="nav-logo">
          <button class="menu-toggle" aria-label="Abrir menú">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
          </button>
        </div>
        <ul class="nav-list">
          <li data-page="home"><a href="../index.html">Home</a></li>
          <li data-page="pokedex"><a href="./pokedex.html">Pokédex</a></li>
          <!--<li data-page="pokemon"><a href="./pokemon.html">Pokémon</a></li>-->
          <li data-page="abilities">
            <a href="./abilities.html">Abilities</a>
          </li>
          <li data-page="moves"><a href="./moves.html">Moves</a></li>
          <li data-page="game"><a href="./game.html">Battle</a></li>
          <li data-page="activities"><a href="./activities.html">Activities</a></li>
        </ul>
      </div>
    </nav>
    </header>

    <section class="first-margin sctn-pokemon-single">
      <div class="container-grid">
        <div class="col-left" data-aos="fade-right" data-aos-duration="600" data-aos-delay="0">
          <h1 class="pokemon-single-title text-color-dark-two"></h1>
          <h2 class="pokemon-single-id text-color-dark"></h2>
          <p class="pokemon-single-description text-color-dark-two"></p>
          <ul class="pokemon-single-types text-color-dark-two"></ul>
          <div class="container-wrappers">
            <div class="wrapper-list-abilities">
              <p class="text-color-dark-two">Habilidades:</p>
              <ul class="pokemon-single-abilities text-color-dark-two"></ul>
            </div>
            <div class="wrapper-list-stats">
              <p class="text-color-dark-two">Stats:</p>
              <ul class="pokemon-single-stats text-color-dark-two">
                <li class="stat-name">
                  <ul class="stat-name-list"></ul>
                </li>
                <li class="stat-value">
                  <ul class="stat-value-list"></ul>
                </li>
              </ul>
            </div>
          </div>
        </div>
        <div class="col-right" data-aos="fade-left" data-aos-duration="600" data-aos-delay="0">
          <a href="" class="play-cry">
            <img src="" alt="" class="image-pokemon"/>
            <span class="tooltip-cry">Reproducir sonido</span>
          </a>
          <!--
          <a href="" class="btn-play">
            <div class="btn-play-cry"></div>
          </a>
          -->
        </div>
