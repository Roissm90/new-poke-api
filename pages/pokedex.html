<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex | Pokémon Atlas</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="../styles/styles.css" />
    <link rel="stylesheet" href="../styles/atlas.css" />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <!-- AOS CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css"
    />
    <!-- AOS JS -->
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- jQuery UI JS -->
    <script src="https://code.jquery.com/ui/1.13.3/jquery-ui.min.js"></script>
    <!-- jQuery UI CSS (opcional, para estilos de widgets) -->
    <link
      rel="stylesheet"
      href="https://code.jquery.com/ui/1.13.3/themes/base/jquery-ui.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"
    />
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"
    ></script>
    <!-- sonidos midi -->
    <script src="https://cdn.jsdelivr.net/npm/tone@latest/build/Tone.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.27/build/Midi.min.js"></script>
  </head>

  <body>
    <header>
    <nav class="nav">
      <div class="container-grid">
        <div class="wrapper-image-header">
          <a href="../index.html">
            <img
              src="../assets/logo_pokemon.png"
              alt="Logo Pokemon"
              class="image-header"
            />
          </a>
        </div>
        <div class="nav-logo">
          <button class="menu-toggle" aria-label="Abrir menú">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
          </button>
        </div>
        <ul class="nav-list">
          <li data-page="home"><a href="../index.html">Home</a></li>
          <li data-page="pokedex"><a href="./pokedex.html">Pokédex</a></li>
          <!--<li data-page="pokemon"><a href="./pokemon.html">Pokemon</a></li>-->
          <li data-page="abilities">
            <a href="./abilities.html">Abilities</a>
          </li>
          <li data-page="moves"><a href="./moves.html">Moves</a></li>
          <li data-page="game"><a href="./game.html">Battle</a></li>
          <li data-page="activities"><a href="./activities.html">Activities</a></li>
        </ul>
      </div>
    </nav>
    </header>

    <section class="first-margin sctn-pokedex" data-aos="fade-up">
      <div class="container-grid">
        <div class="dex-heading">
          <div><p class="eyebrow">EL CATÁLOGO · GENERACIONES I–IX</p><h1>Pokédex</h1><p>Encuentra a tu próximo favorito.</p></div>
          <span id="pokemonCount" class="catalog-count">1.025 Pokémon</span>
        </div>
        <div class="filters">
          <label class="search-field" for="searchInputPokedex"><span>Buscar Pokémon</span>
          <input
            type="text"
            class="input-search"
            placeholder="Nombre o Nº PokéDex"
            id="searchInputPokedex"
          />
          </label>
          <div class="types-filter" ></div>
        </div>

        <div class="dex-results"><p id="pokedexStatus" role="status" aria-live="polite"></p><span id="pageSummary"></span></div>
        <div class="pokemon-cards-grid" aria-label="Resultados de la Pokédex"></div>
        <nav class="pokedex-pagination" aria-label="Paginación de Pokémon"></nav>
      </div>
    </section>

    <script type="module" src="../scripts/index.js"></script>
    <script type="module" src="../scripts/pokedex.js"></script>
  </body>
</html>
